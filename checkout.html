<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Checkout | Afrodita</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" href="css/styles.css" />
  </head>

  <body>
    <nav class="navbar navbar-expand-lg fixed-top navbar-afrodita shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="index.html">Afrodita</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarAfrodita">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarAfrodita">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" href="index.html">Inicio</a>
            </li>
          </ul>

          <button class="btn btn-cart position-relative">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"></span>
          </button>
        </div>
      </div>
    </nav>
    <main class="container my-5 pt-5">

      <h2 class="text-center mb-4">Finalizar compra</h2>

      <div class="row">
        <div class="col-md-7">
          <h4 class="mb-3">Resumen de tu pedido</h4>
          <div id="checkout-carrito" class="d-flex flex-column gap-3"></div>

          <h5 class="mt-4">Total: $ <span id="checkout-total">0</span></h5>
        </div>

        <div class="col-md-5">
          <h4 class="mb-3">Datos del cliente</h4>

          <form id="checkout-form">
            <div class="mb-3">
              <label class="form-label">Nombre completo</label>
              <input type="text" class="form-control" id="nombre" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Correo electrónico</label>
              <input type="email" class="form-control" id="email" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Dirección</label>
              <input type="text" class="form-control" id="direccion" required />
            </div>

            <div class="mb-3">
              <label class="form-label">Teléfono</label>
              <input type="tel" class="form-control" id="telefono" required />
            </div>

            <button type="submit" class="btn btn-primary w-100">
              Pagar ahora
            </button>
          </form>
        </div>
      </div>

      <div id="checkout-confirmacion" class="alert alert-success mt-5 d-none">
        <h4>¡Compra realizada con éxito!</h4>
        <p>Gracias por confiar en Afrodita. Te hemos enviado la confirmación a tu correo.</p>
        <a href="index.html" class="btn btn-primary mt-2">Volver al inicio</a>
      </div>

    </main>

    <script src="js/cart.js"></script>
    <script src="js/checkout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
