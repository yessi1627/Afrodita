<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Afrodita | Belleza Capilar & Piel</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <nav class="navbar navbar-expand-lg fixed-top navbar-afrodita shadow-sm">
      <div class="container">
        <a class="navbar-brand" href="#">Afrodita</a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarAfrodita" aria-controls="navbarAfrodita"
          aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarAfrodita">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link active" href="#">Inicio</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Capilar</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Piel</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#">Tonificantes</a>
            </li>
          </ul>

          <!-- BOTÓN CARRITO CON CONTADOR -->
          <button class="btn btn-cart position-relative">
            <i class="fa-solid fa-cart-shopping"></i>
            <span id="cart-count" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"></span>
          </button>
        </div>
      </div>
    </nav>

    <!-- HERO DEL CARRUSEL -->
    <header class="hero-afrodita">
      <div id="afroditaCarousel" class="carousel slide" data-bs-ride="carousel">
        <div class="carousel-inner">
          <div class="carousel-item active">
            <img src="assets/slider2.jpeg" class="d-block w-100" alt="Belleza capilar Afrodita"/>
            <div class="carousel-caption d-none d-md-block">
              <h1>Afrodita</h1>
              <p>Belleza capilar y cuidado de la piel #1</p>
              <a href="#productos" class="btn btn-primary btn-lg">Ver productos</a>
            </div>
          </div>

          <div class="carousel-item">
            <img
              src="assets/slider1.jpeg"
              class="d-block w-100"
              alt="Productos naturales"
            />
            <div class="carousel-caption d-none d-md-block">
              <h2>Rutinas que transforman</h2>
              <p>Ingredientes naturales y resultados reales</p>
              <a href="#productos" class="btn btn-primary btn-lg">
                Ver productos
              </a>
            </div>
          </div>
        </div>
          
        <button class="carousel-control-prev" type="button" data-bs-target="#afroditaCarousel" data-bs-slide="prev">
          <span class="carousel-control-prev-icon"></span>
        </button>
        <button class="carousel-control-next" type="button" data-bs-target="#afroditaCarousel" data-bs-slide="next">
          <span class="carousel-control-next-icon"></span>
        </button>
        
      </div>
    </header>

    <!-- PRODUCTOS -->
    <section class="container my-5" id="productos">
      <h2 class="text-center mb-4">Nuestros productos</h2>
      <div id="productos-container" class="row g-4"></div>
    </section>

  <!-- CARRITO -->
<section class="container my-5" id="carrito-section">
  <h2 class="text-center mb-4">Tu carrito</h2>

  <div id="carrito-container" class="cart-list"></div>

  <div class="d-flex justify-content-between align-items-center mt-4">
    <button id="vaciar-carrito" class="btn btn-danger">
      Vaciar carrito
    </button>
    <h4>Total: $ <span id="carrito-total">0</span></h4>
  </div>

  <div class="text-end mt-4">
    <a href="checkout.html" class="btn btn-primary"> Finalizar compra </a>
  </div>
</section>


    <script src="js/data.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/productos.js"></script>
    <script src="js/app.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
